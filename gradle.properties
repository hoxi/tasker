pluginGroup=net.tagpad.tasker
pluginName=Tasker
pluginRepositoryUrl=https://github.com/hoxi/tasker
pluginVersion=2026.1
pluginSinceBuild=261
# No platformType: this plugin targets the unified IntelliJ IDEA artifact, which cannot be selected by
# type code — see the comment in build.gradle.kts.
#platformVersion=LATEST-EAP-SNAPSHOT
platformVersion=2026.1
platformBundledPlugins=com.intellij.tasks
platformPlugins=
platformBundledModules=

# Task Management left the IDE distribution in 2026.2 — plugins/tasks is present in 2026.1 and gone from
# 2026.2 — so there it has to come from the Marketplace instead. Two things change, not one: the
# download carries only the tracker implementations, while the API this plugin compiles against
# (com.intellij.tasks.Task, TaskRepository) stays in the platform as intellij.platform.tasks and must be
# requested by name. To build and run against 2026.2, swap the four lines above for:
#
#   platformVersion=2026.2
#   platformBundledPlugins=
#   platformPlugins=com.intellij.tasks:262.8665.173
#   platformBundledModules=intellij.platform.tasks
#
# Or, without editing this file:
#
#   ./gradlew runIde -PplatformVersion=2026.2 -PplatformBundledPlugins= \
#       -PplatformPlugins=com.intellij.tasks:262.8665.173 \
#       -PplatformBundledModules=intellij.platform.tasks
#
# Pick a plugin version whose compatibility range covers the build you are targeting; list them with
#   curl -s "https://plugins.jetbrains.com/api/plugins/11545/updates?size=15"
gradleVersion=9.6.1
kotlin.stdlib.default.dependency=false
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.jvmargs=-Xms1g -Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
