pluginGroup=net.tagpad.tasker
pluginName=Tasker
pluginRepositoryUrl=https://github.com/hoxi/tasker
pluginVersion=2026.2
pluginSinceBuild=261
# No platformType: this plugin targets the unified IntelliJ IDEA artifact, which cannot be selected by
# type code — see the comment in build.gradle.kts.
#platformVersion=LATEST-EAP-SNAPSHOT
platformVersion=2026.2
platformBundledPlugins=
platformCompatiblePlugins=com.intellij.tasks
platformBundledModules=intellij.platform.tasks
platformPlugins=

# Task Management left the IDE distribution in 2026.2 — plugins/tasks is present in 2026.1 and gone from
# 2026.2 — so there it comes from the Marketplace instead. Two things change, not one: the download
# carries only the tracker implementations, while the API this plugin compiles against
# (com.intellij.tasks.Task, TaskRepository) stays in the platform as intellij.platform.tasks and has to
# be requested by name once the plugin around it is no longer bundled.
#
# platformCompatiblePlugins takes ids alone and resolves whichever version the target platform accepts,
# which is what we want for a plugin versioned per IDE build — against 2026.2 it picks 262.8665.173 by
# itself. platformPlugins is the pinned "id:version" form, kept for when a specific build is needed.
#
# On a platform that still bundles it (2026.1 and earlier), use platformBundledPlugins instead:
#
#   platformVersion=2026.1
#   platformBundledPlugins=com.intellij.tasks
#   platformCompatiblePlugins=
#   platformBundledModules=
#
# Either set works from the command line too, without editing this file:
#
#   ./gradlew runIde -PplatformVersion=2026.1 -PplatformBundledPlugins=com.intellij.tasks \
#       -PplatformCompatiblePlugins= -PplatformBundledModules=
gradleVersion=9.6.1
kotlin.stdlib.default.dependency=false
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.jvmargs=-Xms1g -Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
